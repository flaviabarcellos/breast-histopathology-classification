[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "breakhis-classifier"
version = "0.1.0"
description = "Breast histopathology classification with EfficientNetV2B1 and Inception"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["tensorflow>=2.16,<2.19", "numpy>=1.26,<2.1", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "Pillow>=10,<12"]

[tool.poetry]
packages = [{include = "breakhis", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.9,<1"

[tool.poetry.group.notebooks.dependencies]
jupyterlab = ">=4,<5"
ipykernel = ">=6,<7"

[project.scripts]
breakhis = "breakhis.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
